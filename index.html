<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Detective | Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        .auth-card {
            width: 100%;
            max-width: 430px;
            padding: 34px;
            border: 1px solid var(--cd-border);
            border-radius: 22px;
            background: var(--cd-bg-card);
            box-shadow: var(--cd-shadow-card);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
        }

        .cyan {
            color: var(--cd-amber);
        }

        .subtitle {
            margin: 10px 0 28px;
            text-align: center;
            color: var(--cd-text-muted);
            line-height: 1.5;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 25px;
            padding: 5px;
            border-radius: 12px;
            background: var(--cd-bg-tertiary);
        }

        .tab {
            border: 0;
            border-radius: 9px;
            padding: 11px;
            cursor: pointer;
            color: var(--cd-text-muted);
            background: transparent;
            font-weight: 700;
        }

        .tab.active {
            color: var(--cd-text-on-amber);
            background: var(--cd-amber);
        }

        .field {
            margin-bottom: 17px;
        }

        .password-input-wrapper {
            position: relative;
        }

        .password-input-wrapper input {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: var(--cd-text-muted);
            cursor: pointer;
            font-size: 16px;
        }

        .password-toggle:hover {
            color: var(--cd-amber);
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: var(--cd-text-secondary);
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--cd-border);
            border-radius: 10px;
            outline: none;
            color: var(--cd-text-primary);
            background: var(--cd-bg-input);
        }

        input:focus {
            border-color: var(--cd-amber);
            box-shadow: 0 0 0 3px var(--cd-amber-glow);
        }

        #nameField {
            display: none;
        }

        .submit-btn {
            width: 100%;
            margin-top: 5px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: var(--cd-text-on-amber);
            background: var(--cd-amber);
            font-size: 15px;
            font-weight: 900;
        }

        .submit-btn:disabled {
            cursor: not-allowed;
            opacity: .6;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
        }

        #message.error {
            display: block;
            color: var(--cd-crimson);
            border: 1px solid rgba(255, 93, 115, .25);
            background: rgba(255, 93, 115, .08);
        }

        #message.success {
            display: block;
            color: var(--cd-green);
            border: 1px solid rgba(56, 211, 159, .25);
            background: rgba(56, 211, 159, .08);
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: var(--cd-text-muted);
            font-size: 12px;
        }

        .auth-link {
            display: inline-block;
            margin-top: 10px;
            border: 0;
            padding: 0;
            color: var(--cd-amber);
            background: transparent;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .auth-link:hover { text-decoration: underline; }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0 14px;
            color: var(--cd-text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .12em;
        }
        .auth-divider::before, .auth-divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--cd-border);
        }

        .google-btn {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--cd-border);
            border-radius: 10px;
            cursor: pointer;
            color: var(--cd-text-primary);
            background: var(--cd-bg-tertiary);
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--cd-transition-fast);
        }
        .google-btn:hover { border-color: var(--cd-amber); }
        .google-btn:disabled { cursor: not-allowed; opacity: .6; }

        .google-mark { width: 18px; height: 18px; display: inline-block; flex: 0 0 18px; }
        .google-mark path { stroke: none; }

        #forgotPanel { display: none; }
        #forgotPanel.active { display: block; }

        .back-to-login {
            display: block;
            margin: 14px auto 0;
            border: 0;
            background: transparent;
            color: var(--cd-text-muted);
            cursor: pointer;
            font: inherit;
            font-size: 12px;
        }
        .back-to-login:hover { color: var(--cd-amber); }

        @media (max-width: 520px) {
            body { align-items: flex-start; padding: 18px 12px; }
            .auth-card { margin: auto 0; padding: 24px 18px; border-radius: 16px; }
            .logo { font-size: 30px; }
            h1 { font-size: 23px; }
            .subtitle { margin-bottom: 20px; font-size: 14px; }
            .tabs { margin-bottom: 20px; }
            input, .submit-btn { min-height: 48px; font-size: 16px; }
            .footer { font-size: 10px; line-height: 1.5; }
        }

        @media (max-height: 650px) {
            body { align-items: flex-start; }
        }
    </style>
  <script type="module" crossorigin src="/assets/login-DPJJ4Gu4.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabase-C0Bv1Tz9.js">
  <link rel="modulepreload" crossorigin href="/assets/auth-utils-BqN8yWp4.js">
  <link rel="stylesheet" crossorigin href="/assets/login-DXDTMyDp.css">
</head>

<body class="cd-page-auth">

<div class="auth-card">

    <div class="logo">🕵️‍♂️</div>

    <h1>
        Code<span class="cyan">Detective</span>
    </h1>

    <p class="subtitle">
        Authenticate to enter Detective Headquarters.
    </p>

    <div class="tabs">
        <button id="loginTab" class="tab active" type="button">LOGIN</button>
        <button id="signupTab" class="tab" type="button">SIGN UP</button>
    </div>

    <form id="authForm">

        <div class="field" id="nameField">
            <label>DETECTIVE NAME</label>
            <input
                id="displayName"
                type="text"
                placeholder="Eddie"
                autocomplete="name"
            >
        </div>

        <div class="field">
            <label>EMAIL</label>
            <input
                id="email"
                type="email"
                placeholder="detective@example.com"
                autocomplete="email"
                required
            >
        </div>

        <div class="field">
            <label>PASSWORD</label>
            <div class="password-input-wrapper">
                <input
                    id="password"
                    type="password"
                    placeholder="Minimum 6 characters"
                    autocomplete="current-password"
                    minlength="6"
                    required
                >
                <button
                    id="passwordToggle"
                    class="password-toggle"
                    type="button"
                    aria-label="Show password"
                >👁</button>
            </div>
        </div>

        <button id="forgotPasswordBtn" class="auth-link" type="button">Forgot Password?</button>

        <button id="submitBtn" class="submit-btn" type="submit">
            ENTER HEADQUARTERS
        </button>

    </form>

    <div class="auth-divider"><span>or</span></div>
    <button id="googleBtn" class="google-btn" type="button">
        <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
  <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303C33.649 32.657 29.193 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.153 7.957 3.043l5.657-5.657C34.046 6.053 29.18 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
  <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 16.108 18.961 12 24 12c3.059 0 5.842 1.153 7.957 3.043l5.657-5.657C34.046 6.053 29.18 4 24 4c-7.682 0-14.309 4.337-17.694 10.691z"/>
  <path fill="#4CAF50" d="M24 44c5.083 0 9.857-1.947 13.409-5.116l-6.191-5.238C29.211 35.091 26.715 36 24 36c-5.172 0-9.618-3.323-11.283-7.946l-6.522 5.025C9.69 39.556 16.409 44 24 44z"/>
  <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-1.36 3.927-4.968 6.957-9.303 7.999V44h12.48C41.73 40.447 44 32.941 44 24c0-1.341-.138-2.65-.389-3.917z"/>
</svg>
        <span id="googleBtnLabel">Continue with Google</span>
    </button>

    <section id="forgotPanel" aria-hidden="true">
        <h2 style="font-size:18px;margin-bottom:8px;">Reset your password</h2>
        <p style="font-size:12px;line-height:1.6;color:#7B8798;margin-bottom:16px;">
            Enter your account email. If an account exists, we'll send a secure password-reset link.
        </p>
        <form id="forgotForm">
            <div class="field">
                <label for="forgotEmail">EMAIL</label>
                <input id="forgotEmail" type="email" autocomplete="email" placeholder="detective@example.com" required>
            </div>
            <button id="forgotSubmitBtn" class="submit-btn" type="submit">SEND RESET LINK</button>
        </form>
        <button id="backToLoginBtn" class="back-to-login" type="button">← Back to login</button>
    </section>

    <div id="message"></div>

    <div class="footer">
        SECURE DETECTIVE AUTHENTICATION • CODE DETECTIVE
    </div>

</div>

<script src="./theme.js"></script>

</body>
</html>
