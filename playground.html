<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Detective · Playground</title>
<link rel="icon" href="./favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="./playground.css">
<style>
:root{
--bg-primary:#09090D;--bg-secondary:#121D2E;--bg-surface:#0E1420;--surface-teal:#103142;
--border:rgba(255,255,255,.12);--border-hover:rgba(0,243,255,.35);--border-active:rgba(0,243,255,.55);
--border-success:rgba(0,255,136,.40);--border-error:rgba(255,46,99,.40);--border-purple:rgba(155,93,229,.40);
--text-primary:#F3F3F4;--text-secondary:#A0A9B5;--text-muted:#818185;--text-code:#F3F3F4;
--cyan:#00F3FF;--purple:#9B5DE5;--green:#00FF88;--amber:#FFB742;--crimson:#FF2E63;
--font-ui:'Inter',sans-serif;--font-code:'Fira Code',monospace;--bg-terminal:#09090D;
--surface-subtle:rgba(255,255,255,.045);--shadow-card:0 16px 50px rgba(0,0,0,.28);
--glow-cyan:0 0 20px rgba(0,243,255,.15);--glow-cyan-strong:0 0 30px rgba(0,243,255,.25);
--glow-green:0 0 25px rgba(0,255,136,.18);--glow-purple:0 0 25px rgba(155,93,229,.18);
--glow-crimson:0 0 25px rgba(255,46,99,.18);--radius-md:10px}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 50% 0%,rgba(0,243,255,.05),transparent 45%),radial-gradient(circle at 100% 100%,rgba(16,49,66,.10),transparent 38%),var(--bg-primary);color:var(--text-primary);font-family:var(--font-ui);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,243,255,.006) 3px,rgba(0,243,255,.006) 4px)}
.topbar{position:sticky;top:0;z-index:1000;height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(18,29,46,.82);backdrop-filter:blur(20px)}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.35}
.topbar-actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:10px;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-primary);font:600 12px var(--font-ui);text-decoration:none;cursor:pointer;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,background .2s ease}
.btn:hover{transform:translateY(-2px);border-color:var(--border-hover);box-shadow:var(--glow-cyan)}
.btn-primary{background:var(--cyan);border-color:transparent;color:#071018;box-shadow:0 0 20px rgba(0,243,255,.20)}
.btn-primary:hover{background:#20f5ff}
.btn-ghost{background:rgba(18,29,46,.72)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.badge-cyan{background:rgba(0,243,255,.08);color:var(--cyan);border:1px solid rgba(0,243,255,.18)}
.badge-amber{background:rgba(255,183,66,.08);color:var(--amber);border:1px solid rgba(255,183,66,.18)}
.badge-green{background:rgba(0,255,136,.08);color:var(--green);border:1px solid rgba(0,255,136,.18)}
.badge-purple{background:rgba(155,93,229,.08);color:var(--purple);border:1px solid rgba(155,93,229,.18)}
.badge-crimson{background:rgba(255,46,99,.08);color:var(--crimson);border:1px solid rgba(255,46,99,.18)}
</style>
</head>
<body>
<header class="topbar"><a class="playground-brand" href="./home.html"><span class="playground-brand-mark">🔎</span><span>CODE <span style="color:var(--cyan)">DETECTIVE</span></span></a><div class="topbar-actions"><a class="btn btn-ghost" href="./home.html">← Back to HQ</a></div></header>
<main class="playground-page" id="playground-root"><div class="playground-loading">Loading Playground…</div></main>
<script src="./wipro_playground.js"></script>
<script type="module" src="./playground.js"></script>
</body>
</html>
